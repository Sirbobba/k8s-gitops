apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 28.0.10
    helm:
      values: |
        architecture: standalone
        auth:
          enabled: false
        master:
          persistence:
            size: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
